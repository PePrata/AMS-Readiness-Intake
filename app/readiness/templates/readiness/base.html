<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AMS Readiness Intake{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { border-bottom: 2px solid #444; padding-bottom: .4rem; }
    h2 { margin-top: 1.8rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #0055aa; }
    nav a:hover { text-decoration: underline; }
    .badge { display:inline-block; padding:.2rem .6rem; border-radius:4px; font-size:.85rem; font-weight:bold; }
    .badge-draft    { background:#ffe08a; color:#5a4000; }
    .badge-submitted{ background:#c8f7c5; color:#1a5c14; }
    .badge-critical { background:#fde; color:#900; }
    .badge-ok       { background:#e0f7e9; color:#1a5c14; }
    .badge-role     { background:#dde; color:#334; }
    .alert { padding:.75rem 1rem; border-radius:4px; margin:1rem 0; }
    .alert-success { background:#e8f5e9; border-left:4px solid #4caf50; color:#1b5e20; }
    .alert-error   { background:#fdecea; border-left:4px solid #e53935; color:#7f0000; }
    .alert-info    { background:#e3f2fd; border-left:4px solid #1e88e5; color:#0d3b7a; }
    table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
    th, td { border: 1px solid #ccc; padding: .5rem .75rem; text-align: left; }
    th { background: #f4f4f4; }
    tr:hover td { background: #fafafa; }
    form { margin-top: .5rem; }
    label { display: block; margin-top: .75rem; font-weight: bold; }
    input[type=text], input[type=date], textarea, select {
      width: 100%; padding: .4rem; border: 1px solid #aaa; border-radius: 4px;
      box-sizing: border-box; font-size: 1rem; }
    button, .btn { padding: .45rem 1.1rem; border: none; border-radius: 4px;
      cursor: pointer; font-size: 1rem; }
    .btn-primary   { background: #0055aa; color: #fff; }
    .btn-danger    { background: #cc0000; color: #fff; }
    .btn-secondary { background: #888; color: #fff; }
    .errorlist { color: #cc0000; margin: .25rem 0; padding-left: 1.2rem; }
    .missing-list li { margin-bottom: .3rem; }
    .role-bar { background: #eef; border: 1px solid #bbc; padding: .5rem 1rem;
      border-radius: 4px; margin-bottom: 1.2rem; display:flex; align-items:center; gap:1rem; }
    .role-bar form { margin: 0; display:flex; gap:.5rem; align-items:center; }
    .role-bar select { width: auto; }
    .status-row td:first-child { font-weight: bold; width: 30%; }
    a.action-link { color: #0055aa; text-decoration:none; }
    a.action-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
<nav>
  <a href="{% url 'home' %}">🏠 Dashboard</a>
  <a href="{% url 'summary' %}">📋 Summary</a>
</nav>

{% if messages %}
  {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
  {% endfor %}
{% endif %}

{% block content %}{% endblock %}
</body>
</html>
